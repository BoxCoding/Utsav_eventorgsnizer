[pytest]
testpaths = tests
# Import `backend` from the repo root however pytest is launched (CI runs bare `pytest`).
pythonpath = .
filterwarnings =
    # Upstream starlette/httpx transition notice (raised at import time by
    # fastapi.testclient) — not actionable here.
    ignore:Using `httpx` with `starlette.testclient` is deprecated.*
