<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Utsav Android offline</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }
  body {
    display: grid; grid-template-columns: 420px 1fr; align-items: center; gap: 56px; padding: 0 80px;
    color: #fff; font-family: Inter, system-ui, sans-serif;
    background: radial-gradient(700px 420px at 10% 0%, rgba(124, 58, 237, .7), transparent 70%),
      radial-gradient(600px 420px at 100% 100%, rgba(219, 39, 119, .5), transparent 70%), #140f24;
  }
  .phone { justify-self: center; width: 336px; height: 744px; padding: 12px; border-radius: 46px; background: #0b0814;
    box-shadow: 0 0 0 2px rgba(255, 255, 255, .14), 0 40px 80px rgba(0, 0, 0, .55); }
  video { width: 100%; height: 100%; border-radius: 36px; object-fit: cover; display: block; background: #fff; }
  .eyebrow { font-weight: 700; font-size: 15px; letter-spacing: .08em; color: #f5d0fe; margin: 0 0 10px; }
  h1 { font: 800 44px/1.1 'Plus Jakarta Sans', Inter, sans-serif; margin: 0 0 28px; letter-spacing: -.02em; }
  ol { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  li { display: flex; gap: 14px; align-items: center; padding: 14px 18px; border-radius: 16px; font-size: 21px; line-height: 1.35;
    color: rgba(255, 255, 255, .45); background: rgba(255, 255, 255, .04); border: 1px solid transparent; transition: all .35s; }
  li b { flex-shrink: 0; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; font-size: 16px;
    background: rgba(255, 255, 255, .1); }
  li.on { color: #fff; background: rgba(255, 255, 255, .12); border-color: rgba(255, 255, 255, .25); }
  li.on b { background: linear-gradient(120deg, #7c3aed, #db2777); }
  li.done { color: rgba(255, 255, 255, .78); }
  li.done b { background: #15803d; }
  .note { margin-top: 22px; font-size: 16px; color: rgba(255, 255, 255, .6); }
</style>
</head>
<body>
  <div class="phone"><video id="v" src="raw/offline.mp4" muted playsinline preload="auto"></video></div>
  <div>
    <p class="eyebrow">STEP 10 · ANDROID APP</p>
    <h1>Works with no signal</h1>
    <ol id="steps"></ol>
    <p class="note">Real Android 15 emulator recording · the app bundles its own files and an on-device database</p>
  </div>
<script>
  const marks = JSON.parse(new URLSearchParams(location.search).get('marks'));
  const steps = [
    ['airplane', '✈', 'Airplane mode on: no network at all'],
    ['relaunch', '↻', 'Cold start of the app with no signal'],
    ['offline-home', '📱', 'Plans open from the on-device database'],
    ['tick', '✓', 'Tick vendor tasks offline: changes are queued'],
    ['reconnect', '📶', 'Connection back: queued changes sync automatically'],
    ['synced', '☁', `Synced: the server has every tick`],
  ];
  document.getElementById('steps').innerHTML = steps.map(([k, i, t]) => `<li data-k="${k}"><b>${i}</b><span>${t}</span></li>`).join('');
  const v = document.getElementById('v');
  v.addEventListener('timeupdate', () => {
    const t = v.currentTime;
    let current = -1;
    steps.forEach(([k], i) => { if (t >= marks[k] - 0.3) current = i; });
    document.querySelectorAll('li').forEach((li, i) => {
      li.className = i === current ? 'on' : i < current ? 'done' : '';
    });
  });
  // The phone recording ends right as the sync lands: hold its last frame on "Synced".
  v.addEventListener('ended', () => document.querySelectorAll('li').forEach((li, i) => {
    li.className = i === steps.length - 1 ? 'on' : 'done';
  }));
  window.startClip = () => v.play();
</script>
</body>
</html>
