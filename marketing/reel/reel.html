<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Utsav reel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&family=Noto+Sans+Devanagari:wght@700;800;900&display=swap">
<style>html,body{margin:0;background:#000}canvas{display:block;width:540px;height:960px}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Instagram reel for Utsav (v2): beat-synced transitions, kinetic captions and an original
// soundtrack synthesised with Web Audio (so there is nothing to license), ducked under the
// voiceover. Drawn on a 1080x1920 canvas and recorded to MP4 (H.264 + AAC) by record.mjs.
// window.ASSETS (images) and window.VOICE (wav data URLs + durations) are injected first.
const W = 1080, H = 1920;
const BPM = 112, BEAT = 60 / BPM, BAR = BEAT * 4;
const main = document.getElementById('c');
const mainCtx = main.getContext('2d');
const layerA = Object.assign(document.createElement('canvas'), { width: W, height: H });
const layerB = Object.assign(document.createElement('canvas'), { width: W, height: H });
let g = mainCtx; // drawing helpers target whichever context is current
const img = {};
const clamp01 = (t) => Math.max(0, Math.min(1, t));
const ease = (t) => 1 - Math.pow(1 - clamp01(t), 3);
const back = (t) => { t = clamp01(t); const s = 1.9; return 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); };
const pulse = (t) => Math.exp(-((t % BEAT) / BEAT) * 7); // 1 on each beat, decaying

const SCENES_EN = [
  { kicker: 'PROMPT WARS · UTSAV', title: ['Karwa Chauth for', '400 neighbours.', 'In 7 days?'], hl: [1, 2], kind: 'hook' },
  { kicker: 'STEP 1 · DESCRIBE', title: ['Just describe', 'your event.'], hl: [1], shots: ['01-brief'] },
  { kicker: 'STEP 2 · GEMINI READS IT', title: ['It understands', 'everything.'], hl: [1], shots: ['02-understood'], badge: '₹600 × 400 = ₹2,40,000' },
  { kicker: 'STEP 3 · THE WHOLE PLAN', title: ['Budget, categories', '& checklist.'], hl: [1], shots: ['04-budget', '08-checklist'], badge: 'Designed for YOUR event' },
  { kicker: 'STEP 4 · TIMELINE', title: ['Down to', 'moonrise. 🌙'], hl: [1], shots: ['06-timeline', '07-runsheet'], badge: '~Moonrise · Chandra Argh' },
  { kicker: 'STEP 5 · INVITES', title: ['AI-painted', 'invitations.'], hl: [0], kind: 'cards' },
  { kicker: 'STEP 6 · ASK UTSAV', title: ['Ask anything.', 'It knows your plan.'], hl: [0], shots: ['10-ask'] },
  { kicker: 'STEP 7 · SMART ALERTS', title: ['Nothing', 'slips through.'], hl: [1], shots: ['11-alerts'], badge: 'Alerts written from your brief' },
  { kicker: 'BUILT WITH GEMINI', title: ['Plan any celebration', 'with confidence.'], hl: [1], kind: 'cta' },
];
const SCENES_HI = [
  { kicker: 'PROMPT WARS · उत्सव', title: ['400 पड़ोसियों के लिए', 'करवा चौथ…', 'सिर्फ़ 7 दिन में?'], hl: [1, 2], kind: 'hook' },
  { kicker: 'चरण 1 · बताइए', title: ['बस अपना इवेंट', 'बताइए।'], hl: [1], shots: ['01-brief'] },
  { kicker: 'चरण 2 · जेमिनी समझता है', title: ['सब कुछ', 'समझ जाता है।'], hl: [1], shots: ['02-understood'], badge: '₹600 × 400 = ₹2,40,000' },
  { kicker: 'चरण 3 · पूरा प्लान', title: ['बजट, श्रेणियाँ', 'और चेकलिस्ट।'], hl: [1], shots: ['04-budget', '08-checklist'], badge: 'आपके इवेंट के लिए डिज़ाइन' },
  { kicker: 'चरण 4 · टाइमलाइन', title: ['चाँद निकलने', 'तक। 🌙'], hl: [1], shots: ['06-timeline', '07-runsheet'], badge: '~चंद्रोदय · चंद्र अर्घ्य' },
  { kicker: 'चरण 5 · निमंत्रण', title: ['AI से बने', 'निमंत्रण।'], hl: [0], kind: 'cards' },
  { kicker: 'चरण 6 · उत्सव से पूछें', title: ['कुछ भी पूछिए।', 'उसे आपका प्लान पता है।'], hl: [0], shots: ['10-ask'] },
  { kicker: 'चरण 7 · स्मार्ट अलर्ट', title: ['कुछ भी', 'नहीं छूटेगा।'], hl: [1], shots: ['11-alerts'], badge: 'आपके ब्रीफ़ से लिखे अलर्ट' },
  { kicker: 'जेमिनी के साथ बनाया', title: ['हर जश्न की प्लानिंग,', 'पूरे भरोसे के साथ।'], hl: [1], kind: 'cta' },
];
const STRINGS = {
  en: { sub: 'Food · Pooja · Mehndi · Decor · Moonrise', days: 'DAYS LEFT', day: 'DAY LEFT', ready: 'Ready for WhatsApp & email', name: 'Utsav', tagline: 'Your AI event planner' },
  hi: { sub: 'खाना · पूजा · मेहंदी · सजावट · चंद्रोदय', days: 'दिन बाकी', day: 'दिन बाकी', ready: 'व्हाट्सऐप और ईमेल के लिए तैयार', name: 'उत्सव', tagline: 'आपका AI इवेंट प्लानर' },
};
let SCENES = SCENES_EN;
let STR = STRINGS.en;
const TRANSITIONS = ['zoom', 'slide', 'wipe', 'flash', 'slide', 'zoom', 'wipe', 'flash'];
const TR = BEAT; // transition length: one beat

// Scene lengths are rounded up to whole 2-beat units so every cut lands on the beat.
function timeline() {
  let t = 0;
  return SCENES.map((s, i) => {
    const need = (window.VOICE?.[i]?.duration || 4) + 0.7;
    const dur = Math.ceil(need / (BEAT * 2)) * BEAT * 2;
    const out = { ...s, i, start: t, dur, end: t + dur };
    t += dur;
    return out;
  });
}

// ── drawing helpers ──
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }

function background(t) {
  g.fillStyle = '#0f0f13';
  g.fillRect(0, 0, W, H);
  const p = pulse(t);
  const blobs = [['#7c3aed', 0.15, 0.12], ['#db2777', 0.9, 0.35], ['#d97706', 0.25, 0.85], ['#6d28d9', 0.8, 0.95]];
  blobs.forEach(([col, bx, by], i) => {
    const x = W * (bx + 0.06 * Math.sin(t * 0.6 + i)), y = H * (by + 0.04 * Math.cos(t * 0.5 + i));
    const r = g.createRadialGradient(x, y, 0, x, y, 680 + 120 * p);
    const a = Math.round((0.38 + 0.18 * p) * 255).toString(16).padStart(2, '0');
    r.addColorStop(0, col + a); r.addColorStop(1, col + '00');
    g.fillStyle = r; g.fillRect(0, 0, W, H);
  });
  for (let i = 0; i < 80; i++) {
    const x = (i * 197.3) % W, y = (i * 389.7 + t * 30 * (1 + (i % 3))) % H;
    g.globalAlpha = 0.12 + 0.35 * (0.5 + 0.5 * Math.sin(t * 2.2 + i));
    g.fillStyle = i % 7 === 0 ? '#fcd34d' : '#ffffff';
    g.fillRect(x, y, 2.6, 2.6);
  }
  g.globalAlpha = 1;
}

function progress(scenes, t) {
  const n = scenes.length, gap = 10, w = (W - 120 - gap * (n - 1)) / n;
  scenes.forEach((s, i) => {
    const x = 60 + i * (w + gap);
    g.beginPath(); g.roundRect(x, 60, w, 8, 4); g.fillStyle = 'rgba(255,255,255,0.22)'; g.fill();
    const p = clamp01((t - s.start) / s.dur);
    if (p > 0) { g.beginPath(); g.roundRect(x, 60, w * p, 8, 4); g.fillStyle = '#fff'; g.fill(); }
  });
}

function caption(s, local, top = 150) {
  g.save();
  g.textAlign = 'center';
  g.globalAlpha = ease(local / 0.3);
  g.font = '800 30px Inter, "Noto Sans Devanagari", sans-serif';
  // Tracking breaks Devanagari's connecting headline (shirorekha), so only space Latin text.
  const latin = !/[\u0900-\u097F]/.test(s.kicker);
  if ('letterSpacing' in g) g.letterSpacing = latin ? `${6 + 10 * (1 - ease(local / 0.5))}px` : '0px';
  g.fillStyle = '#fcd34d';
  g.fillText(s.kicker, W / 2, top);
  if ('letterSpacing' in g) g.letterSpacing = '0px';
  s.title.forEach((line, i) => {
    const k = (local - 0.1 - i * BEAT / 2) / 0.45;
    if (k <= 0) return;
    const sc = back(k);
    const y = top + 100 + i * 100;
    g.save();
    g.globalAlpha = clamp01(k * 2);
    g.translate(W / 2, y - 30);
    g.rotate((1 - ease(k)) * (i % 2 ? 0.08 : -0.08));
    g.scale(sc, sc);
    g.font = '900 88px Inter, "Noto Sans Devanagari", sans-serif';
    const fit = Math.min(1, (W - 90) / g.measureText(line).width); // longer (e.g. Hindi) lines shrink to fit
    g.scale(fit, fit);
    if (s.hl.includes(i)) {
      const shift = (local * 400) % 1600;
      const gr = g.createLinearGradient(-800 + shift - 800, 0, shift, 0);
      gr.addColorStop(0, '#c4b5fd'); gr.addColorStop(0.33, '#f9a8d4'); gr.addColorStop(0.66, '#fcd34d'); gr.addColorStop(1, '#c4b5fd');
      g.fillStyle = gr;
    } else g.fillStyle = '#ffffff';
    g.shadowColor = 'rgba(0,0,0,0.55)'; g.shadowBlur = 26;
    g.fillText(line, 0, 30);
    g.restore();
  });
  g.restore();
}

function phone(s, local, top, t) {
  const shots = s.shots, dur = s.dur;
  const pw = 700, ph = Math.round(pw * 1980 / 1179), x = (W - pw) / 2;
  const enter = back(local / 0.55);
  const side = s.i % 2 ? 1 : -1;
  const bob = 6 * Math.sin(t * 2);
  g.save();
  g.globalAlpha = clamp01(local / 0.25);
  g.translate(W / 2 + side * (1 - enter) * 500, top + ph / 2 + bob + (1 - enter) * 120);
  g.rotate(side * (1 - ease(local / 0.6)) * 0.18 + 0.012 * Math.sin(t * 1.3));
  g.translate(-W / 2, -(top + ph / 2));
  const y = top;
  g.shadowColor = `rgba(167,139,250,${0.45 + 0.25 * pulse(t)})`; g.shadowBlur = 90 + 40 * pulse(t);
  rr(x - 18, y - 18, pw + 36, ph + 36, 86); g.fillStyle = '#1b1b22'; g.fill();
  g.shadowBlur = 0;
  rr(x - 18, y - 18, pw + 36, ph + 36, 86); g.strokeStyle = 'rgba(255,255,255,0.18)'; g.lineWidth = 3; g.stroke();
  rr(x, y, pw, ph, 70); g.save(); g.clip();
  const seg = dur / shots.length;
  shots.forEach((name, i) => {
    const li = local - i * seg;
    if (li < 0 && i > 0) return;
    const im = img[name];
    const sc = 1 + 0.06 * clamp01(local / dur);
    const dw = pw * sc, dh = dw * im.height / im.width;
    // second shot pushes up from below (a swipe inside the phone)
    const slide = i === 0 ? 0 : (1 - ease(li / 0.5)) * ph;
    g.globalAlpha = 1;
    g.drawImage(im, x - (dw - pw) / 2, y - (dh - ph) * 0.15 + slide, dw, dh);
  });
  // glossy sweep across the screen as it lands
  const sweep = clamp01((local - 0.35) / 0.6);
  if (sweep > 0 && sweep < 1) {
    const sx = x - 300 + sweep * (pw + 600);
    const gl = g.createLinearGradient(sx - 120, 0, sx + 120, 0);
    gl.addColorStop(0, 'rgba(255,255,255,0)'); gl.addColorStop(0.5, 'rgba(255,255,255,0.28)'); gl.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gl; g.fillRect(x, y, pw, ph);
  }
  g.restore();
  g.restore();
}

function badge(text, local, cx, cy, t) {
  if (!text) return;
  const k = (local - 1.0) / 0.45;
  if (k <= 0) return;
  g.save();
  g.font = '800 40px Inter, "Noto Sans Devanagari", sans-serif';
  const w = g.measureText(text).width + 70, h = 88;
  const s = back(k) * (1 + 0.06 * pulse(t));
  g.translate(cx, cy); g.scale(s, s); g.globalAlpha = clamp01(k * 2);
  g.shadowColor = 'rgba(219,39,119,0.6)'; g.shadowBlur = 40;
  const gr = g.createLinearGradient(-w / 2, 0, w / 2, 0);
  gr.addColorStop(0, '#7c3aed'); gr.addColorStop(1, '#db2777');
  rr(-w / 2, -h / 2, w, h, 44); g.fillStyle = gr; g.fill();
  g.shadowBlur = 0; g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, 0, 2);
  g.restore();
}

function hook(local, t) {
  const cx = W / 2, cy = 1240;
  const shake = local < 0.4 ? (0.4 - local) * 30 : 0;
  g.save();
  g.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  g.globalAlpha = ease(local / 0.5);
  const r = 250 * back(local / 0.7) + 14 * pulse(t);
  const glow = g.createRadialGradient(cx, cy, r * 0.6, cx, cy, r * 2);
  glow.addColorStop(0, 'rgba(253,230,138,0.6)'); glow.addColorStop(1, 'rgba(253,230,138,0)');
  g.fillStyle = glow; g.fillRect(0, cy - 700, W, 1400);
  g.beginPath(); g.arc(cx, cy, Math.max(1, r), 0, Math.PI * 2);
  const moon = g.createRadialGradient(cx - 60, cy - 60, 20, cx, cy, Math.max(2, r));
  moon.addColorStop(0, '#fffbeb'); moon.addColorStop(1, '#fcd34d');
  g.fillStyle = moon; g.fill();
  // countdown ticks down on the beat
  const days = Math.max(1, 7 - Math.floor(Math.max(0, local - 0.8) / BEAT));
  const tick = pulse(Math.max(0, local - 0.8));
  g.fillStyle = '#1c1917'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.save(); g.translate(cx, cy - 20); g.scale(1 + 0.12 * tick, 1 + 0.12 * tick);
  g.font = '900 260px Inter, "Noto Sans Devanagari", sans-serif'; g.fillText(String(days), 0, 0); g.restore();
  g.font = '800 46px Inter, "Noto Sans Devanagari", sans-serif'; g.fillText(days === 1 ? STR.day : STR.days, cx, cy + 140);
  g.restore();
  g.save(); g.globalAlpha = ease((local - 1.4) / 0.4);
  g.font = '700 44px Inter, "Noto Sans Devanagari", sans-serif'; g.fillStyle = 'rgba(255,255,255,0.88)'; g.textAlign = 'center';
  g.fillText(STR.sub, W / 2, 1640);
  g.restore();
}

function cards(local, t) {
  const cw = 470, ch = cw * 1350 / 1080;
  const order = [0, 2, 1]; // middle card drawn last, on top
  order.forEach((i) => {
    const k = (local - 0.2 - (i === 1 ? 0.5 : i * 0.25)) / 0.55;
    if (k <= 0) return;
    const li = back(k);
    const spread = (i - 1);
    const angle = spread * 0.16 * ease(k) + spread * 0.02 * Math.sin(t * 1.6);
    const cx = W / 2 + spread * 300 * ease(k), cy = 1180 + Math.abs(spread) * 60 + 8 * Math.sin(t * 2 + i);
    g.save();
    g.globalAlpha = clamp01(k * 2);
    g.translate(cx, cy + (1 - ease(k)) * 420); g.rotate(angle); g.scale(li, li);
    g.shadowColor = 'rgba(0,0,0,0.6)'; g.shadowBlur = 55;
    rr(-cw / 2, -ch / 2, cw, ch, 24); g.fillStyle = '#000'; g.fill();
    g.shadowBlur = 0; rr(-cw / 2, -ch / 2, cw, ch, 24); g.clip();
    g.drawImage(img[`card-${i}`], -cw / 2, -ch / 2, cw, ch);
    g.restore();
  });
  badge(STR.ready, local + 0.3, W / 2, 1730, t);
}

function cta(local, t) {
  g.save();
  const s = 380 * back(local / 0.6) * (1 + 0.04 * pulse(t)), x = (W - s) / 2, y = 950 - s / 2;
  g.globalAlpha = clamp01(local / 0.3);
  g.shadowColor = 'rgba(219,39,119,0.65)'; g.shadowBlur = 100;
  g.drawImage(img.icon, x, y, s, s);
  g.shadowBlur = 0;
  g.textAlign = 'center'; g.fillStyle = '#fff';
  g.globalAlpha = ease((local - 0.3) / 0.4);
  g.font = '900 150px Inter, "Noto Sans Devanagari", sans-serif'; g.fillText(STR.name, W / 2, 1330);
  g.font = '700 44px Inter, "Noto Sans Devanagari", sans-serif'; g.fillStyle = 'rgba(255,255,255,0.88)';
  g.fillText(STR.tagline, W / 2, 1410);
  g.restore();
  g.save(); g.globalAlpha = ease((local - 1) / 0.4);
  g.textAlign = 'center'; g.font = '800 38px Inter, "Noto Sans Devanagari", sans-serif'; g.fillStyle = '#fcd34d';
  g.fillText('#PromptWars  #BuildWithAI  #Gemini', W / 2, 1700);
  g.restore();
}

// Sparkle burst at each cut.
function sparkles(t, since) {
  if (since > 0.9) return;
  g.save();
  for (let i = 0; i < 28; i++) {
    const a = (i / 28) * Math.PI * 2 + i;
    const d = 120 + since * (520 + (i % 5) * 90);
    const x = W / 2 + Math.cos(a) * d, y = 960 + Math.sin(a) * d * 1.3;
    g.globalAlpha = Math.max(0, 1 - since / 0.9);
    g.fillStyle = i % 3 ? '#fcd34d' : '#f9a8d4';
    const r = 7 * (1 - since);
    g.beginPath(); g.moveTo(x, y - r * 2); g.lineTo(x + r, y); g.lineTo(x, y + r * 2); g.lineTo(x - r, y); g.fill();
  }
  g.restore();
}

function drawScene(s, t) {
  const local = Math.max(0, t - s.start);
  background(t);
  if (s.kind === 'hook') { caption(s, local, 300); hook(local, t); }
  else if (s.kind === 'cards') { caption(s, local); cards(local, t); }
  else if (s.kind === 'cta') { cta(local, t); caption(s, local, 340); }
  else { caption(s, local); phone(s, local, 520, t); badge(s.badge, local, W / 2, 1560, t); }
}

function renderTo(canvas, s, t) {
  g = canvas.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1;
  drawScene(s, t);
}

let SC = [];
function frame(t) {
  const idx = Math.max(0, SC.findIndex((x) => t >= x.start && t < x.end));
  const s = SC[idx === -1 ? SC.length - 1 : idx] || SC.at(-1);
  const prev = SC[s.i - 1];
  const into = t - s.start; // time since this scene's cut
  g = mainCtx;
  if (prev && into < TR) {
    // transition from prev → s, centred on the cut
    const p = ease(into / TR);
    renderTo(layerA, prev, t);
    renderTo(layerB, s, t);
    g = mainCtx;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
    const type = TRANSITIONS[(s.i - 1) % TRANSITIONS.length];
    if (type === 'slide') {
      g.drawImage(layerA, -W * p, 0);
      g.drawImage(layerB, W * (1 - p), 0);
    } else if (type === 'zoom') {
      g.save(); g.globalAlpha = 1 - p; g.translate(W / 2, H / 2); g.scale(1 + 0.35 * p, 1 + 0.35 * p); g.drawImage(layerA, -W / 2, -H / 2); g.restore();
      g.save(); g.globalAlpha = p; g.translate(W / 2, H / 2); g.scale(0.82 + 0.18 * p, 0.82 + 0.18 * p); g.drawImage(layerB, -W / 2, -H / 2); g.restore();
    } else if (type === 'wipe') {
      g.drawImage(layerA, 0, 0);
      const edge = -H * 0.6 + p * (W + H * 1.2);
      g.save(); g.beginPath(); g.moveTo(0, 0); g.lineTo(edge, 0); g.lineTo(edge - H * 0.6, H); g.lineTo(0, H); g.closePath(); g.clip();
      g.drawImage(layerB, 0, 0); g.restore();
      g.save(); g.strokeStyle = '#fcd34d'; g.lineWidth = 10; g.shadowColor = '#fcd34d'; g.shadowBlur = 40;
      g.beginPath(); g.moveTo(edge, 0); g.lineTo(edge - H * 0.6, H); g.stroke(); g.restore();
    } else { // flash
      g.drawImage(p < 0.5 ? layerA : layerB, 0, 0);
      g.fillStyle = `rgba(255,255,255,${1 - Math.abs(p - 0.5) * 2})`; g.fillRect(0, 0, W, H);
    }
  } else {
    renderTo(layerB, s, t);
    g = mainCtx;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.drawImage(layerB, 0, 0);
  }
  g = mainCtx;
  if (s.i > 0) sparkles(t, into);
  progress(SC, t);
}

// ── soundtrack: original, synthesised in the browser ──
function music(ac, out, t0, total) {
  const master = ac.createGain();
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -18; comp.ratio.value = 4;
  master.connect(comp).connect(out);
  const noise = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
  const nd = noise.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  const env = (node, t, a, peak, d) => { node.gain.setValueAtTime(0.0001, t); node.gain.exponentialRampToValueAtTime(peak, t + a); node.gain.exponentialRampToValueAtTime(0.0001, t + a + d); };
  const osc = (type, f, t, dur, peak, dest = master, bend) => {
    const o = ac.createOscillator(), gn = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
    if (bend) o.frequency.exponentialRampToValueAtTime(bend, t + dur * 0.8);
    env(gn, t, 0.005, peak, dur); o.connect(gn).connect(dest); o.start(t); o.stop(t + dur + 0.05);
  };
  const noiseHit = (t, dur, peak, type, freq, q = 1) => {
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), gn = ac.createGain();
    s.buffer = noise; f.type = type; f.frequency.value = freq; f.Q.value = q; env(gn, t, 0.002, peak, dur);
    s.connect(f).connect(gn).connect(master); s.start(t, Math.random()); s.stop(t + dur + 0.05);
  };
  const kick = (t) => osc('sine', 150, t, 0.32, 0.9, master, 45);
  const clap = (t) => { noiseHit(t, 0.16, 0.35, 'bandpass', 1600, 1.2); noiseHit(t + 0.012, 0.12, 0.25, 'bandpass', 1200, 1.2); };
  const hat = (t, v = 0.12) => noiseHit(t, 0.05, v, 'highpass', 8000);
  const tabla = (t, f, v = 0.4) => { osc('sine', f * 1.5, t, 0.22, v, master, f); noiseHit(t, 0.03, v * 0.3, 'bandpass', 3000, 3); };
  const pluck = (t, f, v = 0.16) => { osc('triangle', f, t, 0.5, v); osc('sine', f * 2, t, 0.25, v * 0.35); };
  const whoosh = (t) => {
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), gn = ac.createGain();
    s.buffer = noise; f.type = 'bandpass'; f.Q.value = 2;
    f.frequency.setValueAtTime(300, t - 0.35); f.frequency.exponentialRampToValueAtTime(5000, t);
    gn.gain.setValueAtTime(0.0001, t - 0.35); gn.gain.exponentialRampToValueAtTime(0.35, t - 0.02); gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
    s.connect(f).connect(gn).connect(master); s.start(t - 0.35); s.stop(t + 0.3);
  };
  const riser = (t, dur) => {
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), gn = ac.createGain();
    s.buffer = noise; s.loop = true; f.type = 'bandpass'; f.Q.value = 3;
    f.frequency.setValueAtTime(400, t); f.frequency.exponentialRampToValueAtTime(7000, t + dur);
    gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(0.4, t + dur);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.05);
    s.connect(f).connect(gn).connect(master); s.start(t); s.stop(t + dur + 0.1);
  };
  const impact = (t) => { osc('sine', 90, t, 1.2, 0.9, master, 35); noiseHit(t, 0.9, 0.3, 'lowpass', 2500); };

  // tanpura-style drone (Sa, Pa, high Sa) with a slowly breathing filter
  const droneF = ac.createBiquadFilter(); droneF.type = 'lowpass'; droneF.frequency.value = 900;
  const droneG = ac.createGain(); droneG.gain.setValueAtTime(0.0001, t0); droneG.gain.exponentialRampToValueAtTime(0.07, t0 + 1.5);
  droneG.gain.setValueAtTime(0.07, t0 + total - 2); droneG.gain.exponentialRampToValueAtTime(0.0001, t0 + total);
  droneF.connect(droneG).connect(master);
  const lfo = ac.createOscillator(), lfoG = ac.createGain(); lfo.frequency.value = 0.2; lfoG.gain.value = 350; lfo.connect(lfoG).connect(droneF.frequency); lfo.start(t0); lfo.stop(t0 + total);
  [130.81, 196.0, 261.63, 130.81 * 1.003].forEach((f) => { const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.connect(droneF); o.start(t0); o.stop(t0 + total); });

  // chord progression C – Am – F – G as arpeggio roots
  const prog = [[261.63, 329.63, 392.0, 523.25], [220.0, 261.63, 329.63, 440.0], [174.61, 220.0, 261.63, 349.23], [196.0, 246.94, 293.66, 392.0]];
  const drop = SC[1].start, outro = SC.at(-1).start;
  riser(t0 + drop - 2 * BEAT, 2 * BEAT);
  impact(t0 + drop);
  impact(t0 + outro);
  SC.slice(1).forEach((s) => whoosh(t0 + s.start));
  for (let b = 0; b * BEAT < total - 0.2; b++) {
    const t = t0 + b * BEAT, at = b * BEAT, inBar = b % 4;
    const chord = prog[Math.floor(b / 4) % 4];
    if (at < drop) { // intro: tabla + drone only
      if (b % 2 === 0) tabla(t, 220, 0.3);
      continue;
    }
    if (at >= outro) { // outro: sparse chord swell
      if (inBar === 0) chord.forEach((f, i) => pluck(t + i * 0.06, f, 0.12));
      continue;
    }
    if (inBar === 0 || inBar === 2) kick(t);
    if (inBar === 1 || inBar === 3) clap(t);
    hat(t + BEAT / 2, 0.1); hat(t, 0.06);
    if (inBar === 1) tabla(t + BEAT * 0.75, 260, 0.35);
    if (inBar === 3) { tabla(t + BEAT * 0.25, 200, 0.3); tabla(t + BEAT * 0.5, 300, 0.25); }
    // plucked arpeggio, 8th notes
    pluck(t, chord[inBar], 0.13);
    if ((b + 1) % 2) pluck(t + BEAT / 2, chord[(inBar + 2) % 4] * 2, 0.08);
  }
  return master;
}

async function loadAll() {
  SCENES = window.LANG === 'hi' ? SCENES_HI : SCENES_EN;
  STR = STRINGS[window.LANG] || STRINGS.en;
  await document.fonts.load('900 88px Inter');
  await document.fonts.load('800 40px Inter');
  await document.fonts.load('900 88px "Noto Sans Devanagari"', 'अआ');
  await document.fonts.load('700 44px "Noto Sans Devanagari"', 'अआ');
  await Promise.all(Object.entries(window.ASSETS).map(([k, src]) => new Promise((res) => {
    const im = new Image(); im.onload = () => { img[k] = im; res(); }; im.src = src;
  })));
  SC = timeline();
}

// Preview mode (open the file in a browser): plays without sound or recording.
window.preview = async () => { await loadAll(); const t0 = performance.now(); const loop = () => { const t = (performance.now() - t0) / 1000; frame(t % SC.at(-1).end); requestAnimationFrame(loop); }; loop(); };

window.record = async (limit) => {
  await loadAll();
  const total = limit || SC.at(-1).end + 0.6;
  const ac = new AudioContext({ sampleRate: 48000 });
  const dest = ac.createMediaStreamDestination();
  const voiceBus = ac.createGain(); voiceBus.gain.value = 1.15; voiceBus.connect(dest);
  const buffers = await Promise.all(window.VOICE.map(async (v) => ac.decodeAudioData(await (await fetch(v.src)).arrayBuffer())));
  const stream = main.captureStream(30);
  stream.addTrack(dest.stream.getAudioTracks()[0]);
  const rec = new MediaRecorder(stream, { mimeType: 'video/mp4;codecs=avc1.640028,mp4a.40.2', videoBitsPerSecond: 10_000_000, audioBitsPerSecond: 192_000 });
  const chunks = [];
  window.LOG = [];
  rec.onerror = (e) => window.LOG.push(`error: ${e.error?.name} ${e.error?.message}`);
  rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  const stopped = new Promise((r) => { rec.onstop = r; });
  frame(0);
  rec.start(1000);
  const t0 = ac.currentTime + 0.2;
  // window.MUSIC_LEVEL: 0 = no music, 1 = default, up to 2 = louder. Ducking scales with it.
  const level = Math.max(0, Math.min(2, window.MUSIC_LEVEL ?? 1));
  const musicBus = level > 0 ? music(ac, dest, t0, total) : ac.createGain();
  const BED = 0.5 * level, DUCK = 0.18 * level;
  musicBus.gain.setValueAtTime(Math.max(BED, 0.0001), t0);
  SC.forEach((s, i) => {
    const vs = t0 + s.start + (i === 0 ? 0.35 : TR * 0.6);
    const ve = vs + buffers[i].duration;
    const src = ac.createBufferSource(); src.buffer = buffers[i]; src.connect(voiceBus); src.start(vs);
    musicBus.gain.setTargetAtTime(Math.max(DUCK, 0.0001), vs - 0.08, 0.05);
    musicBus.gain.setTargetAtTime(Math.max(BED, 0.0001), ve + 0.05, 0.15);
  });
  musicBus.gain.setTargetAtTime(0.0001, t0 + total - 1.2, 0.35);
  await new Promise((done) => {
    const loop = () => {
      const t = ac.currentTime - t0;
      frame(Math.max(0, Math.min(t, SC.at(-1).end - 0.001)));
      if (t >= total) return done();
      requestAnimationFrame(loop);
    };
    loop();
  });
  rec.stop();
  await stopped;
  return { total, mime: rec.mimeType, b64: await blobToB64(new Blob(chunks, { type: 'video/mp4' })) };
};

function blobToB64(blob) {
  return new Promise((res) => { const fr = new FileReader(); fr.onload = () => res(fr.result.split(',')[1]); fr.readAsDataURL(blob); });
}
