name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q --cov=backend --cov-fail-under=85
        env: { UTSAV_OFFLINE: "1" }
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: pip install -r requirements.txt
      - name: Accessibility audit (axe-core, WCAG 2.1 AA)
        run: |
          UTSAV_OFFLINE=1 python -m uvicorn backend.main:app --port 8101 &
          for _ in $(seq 1 30); do curl -sf localhost:8101/api/health && break; sleep 1; done
          npm run test:a11y
          BASE_URL=http://localhost:8101 npm run test:e2e
